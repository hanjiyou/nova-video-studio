# 手动构建历史桌面包；公开发布统一由 scripts/deliver.cjs 负责。
name: desktop-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: 构建桌面安装包（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      # 安装根依赖（electron / electron-builder 等 devDependencies）
      - run: npm install

      # 构建前端静态产物（frontend/out，会被打进桌面壳）
      - run: cd frontend && npm install && npm run build

      # better-sqlite3 原生模块在当前平台本地编译，electron-builder 打包时会按 Electron ABI 重建
      - run: cd backend && npm ci --omit=dev

      - name: 构建 macOS 安装包
        if: runner.os == 'macOS'
        run: npx electron-builder --config electron-builder.yml --mac

      - name: 构建 Windows 安装包
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.yml --win

      - name: 保存构建产物（不发布）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-manual-${{ matrix.os }}
          path: release/
